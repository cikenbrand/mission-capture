; Mission Capture ships English only.
;
; The 76 translation files under locale/ are deliberately left in the tree so
; that upstream's frequent translation updates continue to merge cleanly -- but
; they still carry OBS's vocabulary ("Scene", "Source", "Profile"), which this
; fork has renamed to Canvas, Element and Rig. Offering them would show a user a
; half-translated interface using the wrong nouns, which is worse than English.
;
; This index is what populates the language selector and what
; GetPreferredLocales() matches the system locale against, so trimming it to
; en-US also keeps a non-English Windows install from auto-selecting a stale
; translation.
;
; To ship a language properly: translate locale/<code>.ini against the current
; en-US vocabulary, then add its section back here.

[en-US]
Name=English
